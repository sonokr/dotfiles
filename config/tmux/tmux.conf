# Prefix
unbind-key C-b
set-option -g prefix C-Space
bind-key C-Space send-prefix

set -g base-index 1
set -g pane-base-index 1
set -g escape-time 0
set -g mouse on 
setw -g mode-keys vi

bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

bind | split-window -h
bind C-| select-layout even-horizontal
bind - split-window -v
bind = select-layout even-vertical
bind -r C-h select-window -t :-
bind -r C-l select-window -t :+
bind e setw synchronize-panes \; display "synchronize-panes #{?pane_synchronized,on,off}"

bind g popup -xC -yC -w70% -d '#{pane_current_path}' -E 'sh $HOME/.local/bin/navi-popup.sh'
bind Space popup -xC -yC -w70% -E 'tmux a -t popup || tmux new -s popup'
bind t popup -xC -yC -w70% -d '#{pane_current_path}' -E 'gitui'
bind T clock-mode
set -g display-panes-time 4000

bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi V send-keys -X select-line
bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "pbcopy"

bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "reattach-to-user-namespace pbcopy"

# Appearance
set -g default-terminal "screen-256color"
set -ga terminal-overrides ",alacritty:Tc"

set -g message-style "bg=#84A0C6 fg=#17171B"
set -g mode-style "fg=black,bg=colour109,noreverse"

set -g window-style 'bg=default'
set -g window-active-style 'bg=default'

set -g status-style "fg=white,bg=default"

set -g status-left-length 32
set -g status-right-length 150
set -g status-interval 5

# set -g status-left '#(tmux display -p "#{pane_current_command}" | grep -q "^ssh$" && echo "🔒")'
set -g status-left '#[fg=colour229,bg=default,bold] #S #[fg=colour221,bg=default,nobold] ⧉ #[fg=colour238,bg=default,nobold]'
set -g status-right '#[fg=colour245]  %d %b %R#[fg=colour254,bg=colour0,nobold]'
# set -g status-left ''
# set -g status-right ''
set -g window-status-format "#[fg=white,bg=default,nobold] #I:#W "
set -g window-status-current-format "#[fg=black,bg=colour109,noreverse,bold] #I:#W #[fg=colour39,bg=default,nobold]"

set -g status-justify centre
set -g status-position top

setw -g monitor-activity on
set -g visual-activity off

set-option -g allow-rename off
set-window-option -g automatic-rename on
set -g renumber-windows on

# tmux-fzf
TMUX_FZF_LAUNCH_KEY="C-f"
TMUX_FZF_OPTIONS="-p -w 62% -h 38% -m"

# List of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-prefix-highlight'
set -g @plugin 'tmux-plugins/tmux-pain-control'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'b0o/tmux-autoreload'
set -g @plugin 'sainnhe/tmux-fzf'

set -g @resurrent-capture-pane-contents 'on'
set -g @continuum-restore 'on'

run '$XDG_CONFIG_HOME/tmux/tmux/plugins/tpm/tpm'

